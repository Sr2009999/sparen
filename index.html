<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spaarpot">
<meta name="theme-color" content="#0e5c4a">
<title>Spaarpot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#16302b;--mut:#6b7d78;--line:#e3e0d6;--g:#0e5c4a;--y:#ffc83d;--r:#d6453d;--ok:#1f9d6b}
@media (prefers-color-scheme:dark){:root:not([data-t=l]){--bg:#0f1a18;--card:#18262310;--card:#172421;--ink:#eaf2ef;--mut:#8aa19a;--line:#26373325;--line:#263a35;--g:#35b894;--y:#ffd35c;--r:#ff6b61;--ok:#3ddc97}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;font-weight:700;margin:22px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mo{display:flex;align-items:center;gap:6px;font-weight:600}
.mo button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:var(--g);color:#fff;border:0;border-radius:22px;padding:20px}
.hero small{opacity:.8}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.03em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sp{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sp b{display:block;font-size:18px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--g);transition:width .4s}
.bar.over i{background:var(--r)}.bar.y i{background:var(--y)}
.mut{color:var(--mut);font-size:14px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx .e{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.tx .m{flex:1;min-width:0}.tx .m div:first-child{font-weight:600}
.tx .a{font-weight:700;white-space:nowrap}.pos{color:var(--ok)}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
nav button span{font-size:22px}
nav button.on{color:var(--g)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--y);color:#16302b;font-size:32px;font-weight:700;box-shadow:0 6px 18px #0004}
input,select,button.pr{font:inherit}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button.pr{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:700}
button.sm{padding:8px 12px;border-radius:10px;border:1px solid var(--g);background:none;color:var(--g);font:inherit;font-weight:700;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{border:0;padding:10px;border-radius:9px;background:none;color:var(--mut);font:inherit;font-weight:700}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
dialog{border:0;border-radius:22px;padding:20px;width:min(440px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.tip{display:flex;gap:12px;margin-bottom:14px}.tip span{font-size:24px}
.tip b{display:block}
.hide{display:none}.card:not(.hero) small{color:var(--mut)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Nieuwe transactie">+</button>
<nav id="nav"></nav>

<dialog id="dlg">
 <form id="f">
  <div class="seg" id="tt"><button type="button" data-v="u" class="on">Uitgave</button><button type="button" data-v="i">Inkomst</button></div>
  <label for="am">Bedrag (€)</label><input id="am" type="number" inputmode="decimal" step="0.01" min="0.01" required>
  <label for="cat">Categorie</label><select id="cat"></select>
  <label for="dt">Datum</label><input id="dt" type="date" required>
  <label for="nt">Notitie (optioneel)</label><input id="nt" maxlength="60" placeholder="Bijv. pizza met vrienden">
  <button class="pr" type="submit">Opslaan</button>
  <button class="pr" type="button" id="cl" style="background:none;color:var(--mut);margin-top:6px">Annuleren</button>
 </form>
</dialog>

<script>
const KEY="spaarpot-v1";
const EXP={Eten:["🍕","need"],Boodschappen:["🛒","need"],Vervoer:["🚲","need"],School:["📚","need"],Kleren:["👕","want"],Uitgaan:["🎉","want"],Snacks:["🍫","want"],Abonnementen:["📱","want"],Games:["🎮","want"],Overig:["🧾","want"],Sparen:["🐷","save"]};
const INC={Salaris:"💼",Bijbaan:"🧑‍🍳",Zakgeld:"🎁",Overig:"💶"};
const NAMES={need:"Nodig",want:"Leuk",save:"Sparen"};
const DEF={tx:[],goals:[],start:0};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
if(typeof S.start!="number")S.start=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>"€ "+Number(n).toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
let tab="home",month=today().slice(0,7),type="u";
const mName=m=>{const[y,mo]=m.split("-");return new Date(y,mo-1,1).toLocaleDateString("nl-NL",{month:"long",year:"numeric"})};
const shift=d=>{let[y,m]=month.split("-").map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}month=y+"-"+String(m).padStart(2,"0");render()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const net=()=>S.tx.reduce((a,x)=>a+(x.t=="i"?x.a:-x.a),0);
const balance=()=>S.start+net();
const goalSaved=o=>o.link?Math.max(balance(),0):o.log.reduce((a,l)=>a+l.a,0);
function calc(){
 const t=S.tx.filter(x=>x.d.startsWith(month));
 const inc=t.filter(x=>x.t=="i").reduce((a,x)=>a+x.a,0);
 const g={need:0,want:0,save:0},byCat={};
 t.filter(x=>x.t=="u").forEach(x=>{const k=(EXP[x.c]||EXP.Overig)[1];g[k]+=x.a;if(k!="save")byCat[x.c]=(byCat[x.c]||0)+x.a});
 S.goals.forEach(o=>o.log.filter(l=>l.d.startsWith(month)).forEach(l=>g.save+=l.a));
 const spent=g.need+g.want;
 return{t,inc,g,spent,byCat,left:inc-spent-g.save};
}

function bar(label,val,target,kind){
 const p=target>0?Math.min(val/target*100,100):0;
 const over=kind!="save"&&val>target&&target>0;
 const cls=over?"over":kind=="save"?"y":"";
 const note=target>0?(kind=="save"?(val>=target?"Doel gehaald 🎉":"Nog "+eur(target-val)+" om te sparen"):(over?eur(val-target)+" boven je budget":eur(target-val)+" over")):"Voeg eerst inkomsten toe";
 return `<div style="margin-bottom:14px"><div class="row"><b>${label}</b><span class="mut">${eur(val)} / ${eur(target)}</span></div><div class="bar ${cls}"><i style="width:${p}%"></i></div><div class="mut">${note}</div></div>`;
}

function txRow(x){
 const ic=x.t=="u"?(EXP[x.c]||EXP.Overig)[0]:(INC[x.c]||"💶");
 const dd=new Date(x.d).toLocaleDateString("nl-NL",{day:"numeric",month:"short"});
 return `<div class="tx"><div class="e">${ic}</div><div class="m"><div>${esc(x.c)}</div><div class="mut">${dd}${x.n?" · "+esc(x.n):""}</div></div><div class="a ${x.t=="i"?"pos":""}">${x.t=="i"?"+":"−"}${eur(x.a)}</div><button class="x" data-del="${x.id}" aria-label="Verwijder">✕</button></div>`;
}

function home(){
 const c=calc();
 const rate=c.inc>0?Math.round((c.g.save/c.inc)*100):0;
 const bal=balance(),main=S.goals.find(o=>o.link)||S.goals[0];
 let h=`<div class="card hero"><div class="row"><small>Op je rekening</small><button class="sm" data-bal="1" style="color:#fff;border-color:#fff9">Saldo aanpassen</button></div><div class="big">${eur(bal)}</div>`;
 if(main){
  const sv=goalSaved(main),rest=main.target-sv,pp=Math.min(sv/main.target*100,100);
  let msg;
  if(rest>0){msg=`Doel ${esc(main.name)}: je hebt nog ${eur(rest)} erbij nodig.`;if(main.date)msg+=` Dat is ${eur(rest/monthsLeft(main.date))} per maand.`}
  else msg=`Doel ${esc(main.name)} gehaald! 🎉`+(main.link&&rest<0?` Je kunt nog ${eur(-rest)} uitgeven en houdt genoeg over.`:"");
  h+=`<div class="bar y" style="background:#ffffff33"><i style="width:${pp}%"></i></div><small>${msg}</small>`;
 }else h+=`<small>${S.tx.length?"Maak een spaardoel om je voortgang te zien.":"Tik op Saldo aanpassen en vul in hoeveel je nu hebt."}</small>`;
 h+=`</div><div class="card"><div class="row"><b>Deze maand</b><span class="mut">over: ${eur(c.left)}</span></div>
 <div class="sp"><div><small>Inkomsten</small><b>${eur(c.inc)}</b></div><div><small>Uitgaven</small><b>${eur(c.spent)}</b></div><div><small>Gespaard</small><b>${eur(c.g.save)}</b></div><div><small>Spaarquote</small><b>${rate}%</b></div></div></div>`;
 h+=`<h2>50/30/20-check</h2><div class="card">${bar("Nodig (50%)",c.g.need,c.inc*.5,"need")}${bar("Leuk (30%)",c.g.want,c.inc*.3,"want")}${bar("Sparen (20%)",c.g.save,c.inc*.2,"save")}<div class="mut">Nodig = eten, vervoer, school. Leuk = kleren, uitgaan, abonnementen.</div></div>`;
 const cats=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]);
 h+=`<h2>Waar gaat je geld heen?</h2><div class="card">`;
 if(!cats.length)h+=`<div class="empty">Nog geen uitgaven deze maand.<br>Tik op + om er een toe te voegen.</div>`;
 else cats.forEach(([k,v])=>{h+=`<div style="margin-bottom:10px"><div class="row"><span>${EXP[k][0]} ${k}</span><b>${eur(v)}</b></div><div class="bar ${EXP[k][1]=="want"?"y":""}"><i style="width:${v/c.spent*100}%"></i></div></div>`});
 h+=`</div>`;
 return h;
}

function list(){
 const c=calc();
 const t=[...c.t].sort((a,b)=>b.d.localeCompare(a.d));
 return `<h2>Alle transacties</h2><div class="card">${t.length?t.map(txRow).join(""):`<div class="empty">Niks deze maand. Tik op + om te beginnen.</div>`}</div>`;
}

function monthsLeft(d){const n=new Date(),e=new Date(d);return Math.max(1,(e.getFullYear()-n.getFullYear())*12+e.getMonth()-n.getMonth())}

function goals(){
 let h=`<h2>Spaardoelen</h2>`;
 if(!S.goals.length)h+=`<div class="card empty">Nog geen doel. Wat wil je kopen of waar spaar je voor?</div>`;
 S.goals.forEach(o=>{
  const s=goalSaved(o),p=Math.min(s/o.target*100,100),rest=Math.max(o.target-s,0);
  let extra="";
  if(rest==0)extra="Gehaald! 🎉";
  else if(o.date){const m=monthsLeft(o.date);extra=`Nog ${eur(rest)}. Spaar ${eur(rest/m)} per maand om ${new Date(o.date).toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})} te halen.`}
  else extra=`Nog ${eur(rest)} te gaan.`;
  h+=`<div class="card"><div class="row"><b style="font-size:18px">🎯 ${esc(o.name)}</b><button class="x" data-dg="${o.id}" aria-label="Verwijder doel">✕</button></div>
  <div class="row mut"><span>${eur(s)}</span><span>${eur(o.target)}</span></div><div class="bar y" style="height:16px"><i style="width:${p}%"></i></div>
  <div class="mut" style="margin-bottom:12px">${extra}</div>${o.link?`<span class="pill">Gekoppeld aan je saldo</span>`:`<button class="sm" data-dep="${o.id}">+ Geld inleggen</button>`}</div>`;
 });
 h+=`<h2>Nieuw doel</h2><div class="card"><form id="gf"><label for="gn">Waarvoor spaar je?</label><input id="gn" required maxlength="40" placeholder="Bijv. nieuwe laptop">
 <label for="gt">Bedrag (€)</label><input id="gt" type="number" inputmode="decimal" min="1" step="0.01" required>
 <label for="gd">Deadline (optioneel)</label><input id="gd" type="date" min="${today()}">
 <label style="display:flex;gap:10px;align-items:center"><input id="gl" type="checkbox" style="width:auto" ${S.goals.some(o=>o.link)?"":"checked"}> Koppel aan mijn saldo</label><div class="mut">Dan telt het geld op je rekening automatisch mee voor dit doel.</div>
 <button class="pr" type="submit">Doel toevoegen</button></form></div>`;
 return h;
}

function tips(){
 const T=[["🧮","50/30/20-regel","Van je inkomen gaat 50% naar nodige dingen, 30% naar leuke dingen en 20% naar sparen. De app laat zien hoe je ervoor staat."],
 ["🥇","Betaal jezelf eerst","Zet direct na je inkomen geld opzij, voordat je iets uitgeeft. Wat overblijft is je vrije geld."],
 ["⏳","24-uurs-regel","Wil je iets leuks kopen dat niet nodig is? Wacht een dag. Vaak is de zin dan weg."],
 ["🛟","Bouw een buffer","Spaar eerst een buffer voor onverwachte kosten. Een mooi startdoel is 3 maanden aan vaste uitgaven."],
 ["📱","Check je abonnementen","Streaming, apps en sportschool lopen stil door. Zeg elk kwartaal op wat je niet gebruikt."],
 ["🧾","Noteer alles één week","Geef een week lang elke uitgave in, ook kleine. Je ziet snel waar het geld stiekem blijft."],
 ["🎯","Maak doelen concreet","Een doel met bedrag en datum werkt beter dan 'ik wil meer sparen'. Zet het onder Doelen."]];
 return `<h2>Slim sparen</h2><div class="card">${T.map(t=>`<div class="tip"><span>${t[0]}</span><div><b>${t[1]}</b><span class="mut" style="font-size:14px">${t[2]}</span></div></div>`).join("")}</div>
 <h2>Back-up</h2><div class="card"><div class="mut" style="margin-bottom:12px">Je gegevens staan alleen op dit apparaat. Maak af en toe een back-up.</div>
 <div class="row"><button class="sm" id="ex">Exporteer</button><button class="sm" id="im">Importeer</button></div><input type="file" id="fi" accept="application/json" class="hide"></div>`;
}

const TABS=[["home","🏠","Overzicht"],["list","🧾","Transacties"],["goals","🎯","Doelen"],["tips","💡","Tips"]];
function render(){
 const head=(tab=="home"||tab=="list")?`<div class="top"><h1>Spaarpot</h1><div class="mo"><button data-m="-1" aria-label="Vorige maand">‹</button><span style="min-width:120px;text-align:center">${mName(month)}</span><button data-m="1" aria-label="Volgende maand">›</button></div></div>`:`<div class="top"><h1>Spaarpot</h1></div>`;
 $("#app").innerHTML=head+({home,list,goals,tips}[tab])();
 $("#nav").innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${tab==t[0]?"on":""}"><span>${t[1]}</span>${t[2]}</button>`).join("");
 $("#fab").style.display=(tab=="goals"||tab=="tips")?"none":"block";
}

function fillCats(){
 $("#cat").innerHTML=Object.keys(type=="u"?EXP:INC).map(k=>`<option>${k}</option>`).join("");
}
function openDlg(){
 type="u";document.querySelectorAll("#tt button").forEach(b=>b.classList.toggle("on",b.dataset.v=="u"));
 fillCats();$("#f").reset();$("#dt").value=today();$("#dlg").showModal();$("#am").focus();
}

document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0)}
 else if(t.dataset.m)shift(+t.dataset.m);
 else if(t.dataset.del){S.tx=S.tx.filter(x=>x.id!=t.dataset.del);save();render()}
 else if(t.dataset.dg){if(confirm("Dit doel verwijderen?")){S.goals=S.goals.filter(o=>o.id!=t.dataset.dg);save();render()}}
 else if(t.dataset.dep){const o=S.goals.find(g=>g.id==t.dataset.dep);const v=parseFloat((prompt("Hoeveel wil je inleggen? (€)")||"").replace(",","."));if(v>0){o.log.push({d:today(),a:v});save();render()}}
 else if(t.dataset.bal){const v=parseFloat((prompt("Hoeveel staat er nu op je rekening? (€)",balance().toFixed(2))||"").replace(",","."));if(!isNaN(v)){S.start=v-net();save();render()}}
 else if(t.id=="fab")openDlg();
 else if(t.id=="cl")$("#dlg").close();
 else if(t.closest("#tt")){type=t.dataset.v;document.querySelectorAll("#tt button").forEach(b=>b.classList.toggle("on",b===t));fillCats()}
 else if(t.id=="ex"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="spaarpot-backup-"+today()+".json";a.click()}
 else if(t.id=="im")$("#fi").click();
});
document.addEventListener("submit",e=>{
 e.preventDefault();
 if(e.target.id=="f"){
  const a=parseFloat($("#am").value);if(!(a>0))return;
  S.tx.push({id:uid(),t:type,a,c:$("#cat").value,d:$("#dt").value,n:$("#nt").value.trim()});
  save();month=$("#dt").value.slice(0,7);$("#dlg").close();render();
 }else if(e.target.id=="gf"){
  S.goals.push({id:uid(),name:$("#gn").value.trim(),target:parseFloat($("#gt").value),date:$("#gd").value||"",log:[],link:$("#gl").checked});
  save();render();
 }
});
document.addEventListener("change",e=>{
 if(e.target.id!="fi"||!e.target.files[0])return;
 const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d.tx)&&Array.isArray(d.goals)){S=d;save();render();alert("Back-up geïmporteerd.")}else throw 0}catch(x){alert("Dit bestand is geen geldige back-up.")}};
 r.readAsText(e.target.files[0]);
});
render();
</script>
</body>
</html>
